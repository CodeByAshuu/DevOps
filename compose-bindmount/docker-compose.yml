version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: mysql_container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: user123

    ports:
      - "3307:3306"

    volumes:
      - ./mysql-data:/var/lib/mysql
